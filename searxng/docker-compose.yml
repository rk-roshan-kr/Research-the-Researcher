version: "3.8"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: rtr_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    networks:
      - rtr_net

networks:
  rtr_net:
    driver: bridge
