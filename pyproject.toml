[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-the-researcher"
version = "1.0.0"
description = "High-performance, 100% local OSINT pipeline for comprehensive academic intelligence, deduplication, and co-author graphing."
readme = "README.md"
authors = [
    { name = "Roshan Kumar Gupta", email = "roshankumargupta.sh@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["osint", "academic-intelligence", "ollama", "faiss", "bloom-filter", "minhash", "openalex", "scholar"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.10.0",
    "aiolimiter>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "ollama>=0.4.0",
    "pydantic>=2.0.0",
    "xxhash>=3.4.0",
    "mmh3>=4.0.0",
    "bitarray>=2.9.0",
    "datasketch>=1.6.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "jinja2>=3.1.2",
    "rich>=13.7.0",
    "markdown>=3.5.0",
    "sortedcontainers>=2.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",
    "flask>=3.0.0",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.8.0"]
test = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/rk-roshan-kr/Research-the-Researcher"
Repository = "https://github.com/rk-roshan-kr/Research-the-Researcher.git"

[project.scripts]
researcher = "academic_pipeline.cli:main"
academic-profile = "academic_pipeline.cli:main"
