# Manual rankings for EarthOS / TARS collaboration evaluation
#
# SCORING GUIDE
#   5 = perfect fit — work directly addresses an active investigation blocker
#   4 = strong fit  — significant topic or method overlap with EarthOS/TARS
#   3 = moderate    — related area, meaningful but indirect overlap
#   2 = weak        — adjacent field, limited connection
#   1 = no fit      — different research domain entirely
#
# ACTIVE INVESTIGATIONS (for reference while scoring):
#   INV-1: Does curriculum ordering affect long-term cognitive coherence in EarthOS?
#          Blockers: CKA/RSA dataset, coherence measurement methodology
#   INV-2: Why does TARS prediction error not decrease monotonically during training?
#          Blockers: theoretical framework for non-monotonic active inference learning curves
#   INV-3: What specificity threshold separates useful from useless research blockers?
#          Blockers: labeled blocker quality dataset
#
# HOW TO RUN:
#   python evaluate_rankings.py \
#       --corpus outputs/self_corpus.json \
#       --dossiers outputs/batch_profile_results.json \
#       --manual evals/manual_rankings.yaml --no-llm
#
# TARGET: Kendall τ > 0.5 on this set = system producing measurable signal
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════
